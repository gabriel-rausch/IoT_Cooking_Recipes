    <rect x="45" y="48" width="410" height="152" rx="14" fill="#173540" stroke="#9de4cb" stroke-width="3"/>
    <path d="M66 158h42l18-46 25 31 22-64 25 66 24-23 20 32 22-51 26 39h28l18-34 24 48h30" fill="none" stroke="#ffb28e" stroke-width="5" stroke-linejoin="round"/>
    <g fill="#e5f4ed" font-family="monospace" font-size="16"><text x="61" y="82">ADC: 1280</text><text x="250" y="82">ADC: 2045</text><text x="61" y="185">ADC: 3098</text></g>
