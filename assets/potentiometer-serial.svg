    <text x="76" y="223" fill="#f3f7ed" font-size="61" font-weight="800">TURN THE</text><text x="76" y="297" fill="#ffb28e" font-size="61" font-weight="800">DIAL.</text>
    <text x="80" y="366" fill="#d3e6df" font-size="22">See analog values change.</text><path d="M80 425h76" stroke="#77ddbd" stroke-width="5" stroke-linecap="round"/><text x="80" y="470" fill="#a9c8c0" font-size="16" letter-spacing="1">ANALOG INPUT • SERIAL</text>
  </g>
  <g transform="translate(632 133)">
