<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Hello World – Blink</title>
  <desc id="description">Illustration of an ESP32 development board connected to a blinking LED and a touch wire.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102c3c"/>
      <stop offset="1" stop-color="#1b5260"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30b89b"/>
      <stop offset="1" stop-color="#168271"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff745e" stop-opacity=".58"/>
      <stop offset="1" stop-color="#ff745e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#d9f3e7" opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071923" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="34" fill="url(#background)"/>
  <rect width="1200" height="630" rx="34" fill="url(#grid)"/>
  <circle cx="935" cy="313" r="280" fill="#62d8bd" opacity=".08"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="76" y="82" width="184" height="38" rx="19" fill="#d5f3e8" opacity=".13"/>
    <circle cx="99" cy="101" r="6" fill="#79e0bd"/>
    <text x="116" y="107" fill="#bdebdc" font-size="16" font-weight="700" letter-spacing="2">ESP32 • STATION 01</text>

    <text x="76" y="226" fill="#f3f7ed" font-size="72" font-weight="800" letter-spacing="-2">HELLO</text>
    <text x="76" y="304" fill="#f3f7ed" font-size="72" font-weight="800" letter-spacing="-2">WORLD</text>
    <text x="76" y="388" fill="#ffb28e" font-size="76" font-weight="800" letter-spacing="1">BLINK<span fill="#f3f7ed">.</span></text>
    <text x="80" y="445" fill="#d3e6df" font-size="23">Code. Touch. Light.</text>
    <path d="M80 490h76" stroke="#77ddbd" stroke-width="5" stroke-linecap="round"/>
    <text x="80" y="535" fill="#a9c8c0" font-size="17" letter-spacing="1">A FIRST STEP IN PHYSICAL COMPUTING</text>
  </g>

